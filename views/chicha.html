<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sai Sri Kumar | Portfolio</title>
  
  <link rel="stylesheet" href="chicha.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body >
  <canvas id="fluid"></canvas>
  <header class="navbar">
    <div class="logo">SSK</div>
    <nav class="nav-links">
      <span class="nav"><a href="#">CHICHA</a></span>
    </nav>
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
      <span id="theme-icon" class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
        </svg>
      </span>
    </button>
  </header>
  <div class="custom-cursor"></div>
  <div class="image-hover-cursor">
    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="none" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 12H5m14 0-4 4m4-4-4-4"/>
    </svg>
  </div>
  <section class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">CHICHA</h1>
      <p class="hero-subtitle">AI-Powered Chatbot</p>
      <div class="hero-tags">
        <span class="hero-tag-names">Node.js</span>
        <span class="hero-tag-names">MonogoDB</span>
        <span class="hero-tag-names">Gemini Flash</span>
      </div>
      <div class="hero-buttons">
        <a href="https://chicha-5c0n.onrender.com/" class="visit" target="_blank">Live Demo</a>
        <a href="https://github.com/Sai-Sri-Kumar/Chicha" class="git" target="_blank">View Code</a>
      </div>
    </div>
    <div class="hero-image">
      <img src="images/bot.png" alt="Chicha Bot" />
    </div>
  </section>

  <section class="image-gallery">
    <h2 class="gallery-title">Chatbot in Action</h2>
    <div class="gallery-container">
      <div class="gallery-scroll">
        <img src="/images/team.png" alt="Chatbot Screenshot 2" />
        <img src="/images/home.png" alt="Chatbot Screenshot 1" />
        <img src="/images/about.png" alt="Chatbot Screenshot 3" />
        <img src="/images/contact.png" alt="Chatbot Screenshot 4" />
        <img src="/images/chat.png" alt="Chatbot Screenshot 5" />
        <img src="/images/admin1.png" alt="Chatbot Screenshot 6" />
        <img src="/images/admin2.png" alt="Chatbot Screenshot 7" />
        <img src="/images/admin3.png" alt="Chatbot Screenshot 8" />
        <img src="/images/login.png" alt="Chatbot Screenshot 9" />
        <img src="/images/signup.png" alt="Chatbot Screenshot 10" />

      </div>
    </div>
  </section>

  <script src="script.js"></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js'></script>
  <script  src="smoke.js"></script>

</body>
</html>
